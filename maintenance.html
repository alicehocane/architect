<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* Simple Reset & Layout */
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1f2937;
        }

        /* Card Container */
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* Typography */
        h1 {
            margin-top: 0;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            color: #111827;
        }
        p {
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 0;
        }
        
        /* Optional: Icon Styling */
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚧</div>
        <h1>Under Construction</h1>
        <p>We are currently updating our website to provide you with a better experience. Please check back soon!</p>
    </div>
</body>
</html>
